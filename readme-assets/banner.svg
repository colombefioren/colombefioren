  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }
      .display { font-family: 'Archivo', 'Arial Black', sans-serif; font-weight: 800; }
      .speck { transform-box: fill-box; transform-origin: center; animation-name: twinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; opacity: var(--peak); }
      @keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: var(--peak); } }
      .leaf { transform-box: fill-box; transform-origin: center; animation: leaf-pop 0.5s cubic-bezier(0.65 0 0.35 1) both; animation-delay: var(--leaf-delay); }
      @keyframes leaf-pop { from { transform: scale(0); } }
      @keyframes rise-in { from { opacity: 0; transform: translate(0, 14px); } to { opacity: 1; transform: translate(0, 0); } }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .tick-fade { animation: fade-in 0.6s ease-out 1.55s both; }
      .rise-a { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.55s both; }
      .rise-b { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.62s both; }
      .rise-c { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.72s both; }
      .rise-d { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 1.86s both; }
      .rise-e { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 2.02s both; }
      .rise-f { animation: rise-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 2.2s both; }
    </style>
